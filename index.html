<body>
<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UralCoin</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<header>

<div class="close">
Закрыть
</div>


<div class="title">

<h1>
UralCoin
</h1>

<span>
мини-приложение
</span>

</div>


<div class="more">
•••
</div>


</header>





<section class="user">


<div class="avatar">
U
</div>


<div class="username">

<h2>
Игрок
</h2>

<p>
Онлайн: 1
</p>

</div>



<div class="star">
★
</div>


</section>





<main>


<div class="balance-title">
Ваш счет:
</div>



<div class="balance">

0.000

</div>



<div class="speed">

+ 0.000 / сек.

</div>



<div class="click-power">

+ 0.001 / клик.

</div>




<div class="coin">


<div class="u-letter">
U
</div>


</div>



</main>






<nav>



<div class="tabs">


<button class="active">
Меню
</button>


<button>
Улучшения
</button>


<button>
Бонусы
</button>


</div>





<div class="menu">



<div class="item">

<div class="icon rating">
★
</div>

<span>
Рейтинг
</span>

</div>





<div class="item">

<div class="icon transfer">
↔
</div>

<span>
Перевести
</span>

</div>





<div class="item">

<div class="icon catalog">
▣
</div>

<span>
Каталог
</span>

</div>





<div class="item">

<div class="icon accept">
✓
</div>

<span>
Принять
</span>

</div>





<div class="item">

<div class="icon profile">
●
</div>

<span>
Профиль
</span>

</div>



</div>



</nav>



</div>




<script src="app.js"></script>


</body>

</html>
