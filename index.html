<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Empire Casino</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="app">


<header class="header">

<h1>EMPIRE</h1>

<div class="subtitle">
CASINO
</div>

</header>



<section class="balance-box">

<div class="label">
BALANCE
</div>

<div id="balance">
10000
</div>

<div class="chips">
CHIPS
</div>

</section>



<h2 class="games-title">
GAMES
</h2>



<div class="games">



<div class="game-card">

<img src="assets/olympus.png">

<h3>
Gates Olympus
</h3>

<button onclick="playGame('Olympus')">
PLAY
</button>

</div>




<div class="game-card">

<img src="assets/doghouse.png">

<h3>
Dog House
</h3>

<button onclick="playGame('Dog House')">
PLAY
</button>

</div>





<div class="game-card">

<img src="assets/bandit.png">

<h3>
Le Bandit
</h3>

<button onclick="playGame('Bandit')">
PLAY
</button>

</div>





<div class="game-card">

<img src="assets/roulette.png">

<h3>
Roulette
</h3>

<button onclick="playGame('Roulette')">
PLAY
</button>

</div>



</div>




<nav class="menu">


<button class="active">
HOME
</button>


<button>
GAMES
</button>


<button>
FRIENDS
</button>


<button>
PROFILE
</button>


</nav>



</div>



<script src="app.js"></script>


</body>

</html>
