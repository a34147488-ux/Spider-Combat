<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spider Empire</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at top,#204080,#050914);
color:white;
overflow:hidden;
}


.container{
padding:25px;
}


.logo{
font-size:45px;
font-weight:900;
letter-spacing:12px;
text-align:center;
margin-top:20px;
text-shadow:
0 0 20px #00ffff;
}

.sub{
text-align:center;
font-size:25px;
letter-spacing:15px;
color:#668cff;
}


.card{

margin-top:35px;

background:
rgba(255,255,255,.12);

border:

1px solid rgba(255,255,255,.2);

border-radius:35px;

padding:25px;

backdrop-filter:blur(20px);

text-align:center;

box-shadow:
0 0 40px rgba(0,255,255,.15);

}


.title{
letter-spacing:10px;
opacity:.7;
}

.balance{

font-size:80px;
font-weight:800;

text-shadow:
0 0 30px cyan;

}



.level{

display:inline-block;

padding:15px 50px;

border-radius:40px;

background:
linear-gradient(90deg,#00ffff,#487cff);

font-size:25px;

}


.arena{

margin-top:40px;

height:340px;

display:flex;

align-items:center;

justify-content:center;

}



.spider{

width:220px;
height:220px;

border-radius:50%;

background:
radial-gradient(circle,#111,#02040a);

position:relative;

box-shadow:

0 0 60px cyan;

animation:
float 3s infinite ease-in-out;

cursor:pointer;

}


.spider:before{

content:"";

position:absolute;

width:80px;
height:80px;

background:#050505;

border-radius:50%;

top:35px;
left:70px;

border:5px solid cyan;

}


.spider:after{

content:"";

position:absolute;

width:130px;
height:80px;

background:#050505;

border-radius:50%;

top:95px;
left:45px;

border:5px solid cyan;

}



.leg{

position:absolute;

width:100px;

height:8px;

background:cyan;

box-shadow:0 0 15px cyan;

}


.l1{top:100px;left:-60px;transform:rotate(25deg)}
.l2{top:130px;left:-70px;transform:rotate(-25deg)}
.l3{top:100px;right:-60px;transform:rotate(-25deg)}
.l4{top:130px;right:-70px;transform:rotate(25deg)}



@keyframes float{

50%{
transform:translateY(-15px);
}

}



.tap{

margin-top:20px;

font-size:25px;

text-align:center;

}


.stats{

display:flex;

justify-content:space-between;

margin-top:20px;

}


.stat{

background:
rgba(255,255,255,.08);

padding:15px;

border-radius:20px;

}



.menu{

position:fixed;

bottom:20px;

left:20px;

right:20px;

display:flex;

justify-content:space-around;

padding:20px;

border-radius:40px;

background:
rgba(255,255,255,.15);

backdrop-filter:blur(20px);

}


.menu div{

opacity:.8;

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
SPIDER
</div>

<div class="sub">
EMPIRE
</div>


<div class="card">

<div class="title">
BALANCE
</div>

<div class="balance" id="balance">
0
</div>


<div class="level">
LEVEL 1
</div>

</div>



<div class="arena">


<div class="spider" onclick="tap()">

<div class="leg l1"></div>
<div class="leg l2"></div>
<div class="leg l3"></div>
<div class="leg l4"></div>

</div>


</div>



<div class="tap">
TAP SPIDER
</div>



<div class="stats">

<div class="stat">
POWER<br>
<b id="power">1</b>
</div>


<div class="stat">
ENERGY<br>
<b>1000</b>
</div>


<div class="stat">
FRIENDS<br>
<b>0</b>
</div>


</div>


</div>



<div class="menu">

<div>HOME</div>
<div>UPGRADE</div>
<div>FRIENDS</div>
<div>PROFILE</div>

</div>




<script>


let balance=0;


function tap(){

balance++;

document.getElementById("balance").innerHTML=balance;


navigator.vibrate?.(20);


}


let tg=window.Telegram.WebApp;

tg.expand();


</script>



</body>
</html>
