<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Empire Casino</title>

<link rel="stylesheet" href="style.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>


<body>


<div class="app">


<header class="casino-header">

<h1>EMPIRE</h1>

<p>CASINO</p>

</header>



<section class="balance-box">

<span>BALANCE</span>

<h2 id="balance">10000</h2>

<div class="currency">
CHIPS
</div>

</section>




<section class="games">


<h3>GAMES</h3>



<div class="game-card">

<img src="assets/olympus.png">

<div>

<h2>Gates Olympus</h2>

<button onclick="openGame('olympus')">
PLAY
</button>

</div>

</div>





<div class="game-card">

<img src="assets/doghouse.png">

<div>

<h2>Dog House</h2>

<button onclick="openGame('doghouse')">
PLAY
</button>

</div>

</div>





<div class="game-card">

<img src="assets/lebandit.png">

<div>

<h2>Le Bandit</h2>

<button onclick="openGame('bandit')">
PLAY
</button>

</div>

</div>





<div class="game-card">

<img src="assets/roulette.png">

<div>

<h2>Roulette</h2>

<button onclick="openGame('roulette')">
PLAY
</button>

</div>

</div>



</section>






<nav class="menu">


<button onclick="home()">

⌂

<span>
HOME
</span>

</button>



<button onclick="games()">

♛

<span>
GAMES
</span>

</button>




<button onclick="friends()">

♟

<span>
FRIENDS
</span>

</button>



<button onclick="profile()">

●

<span>
PROFILE
</span>

</button>



</nav>



</div>



<script src="app.js"></script>


</body>

</html>
