<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spider Empire</title>


<script src="https://telegram.org/js/telegram-web-app.js"></script>


<link rel="stylesheet" href="style.css">


</head>


<body>


<div class="app">



<!-- ЛОГО -->

<div class="logo">

SPIDER

<span>EMPIRE</span>

</div>



<!-- ПРОФИЛЬ -->


<div class="player">

<div id="username">
PLAYER
</div>

</div>





<!-- БАЛАНС -->


<div class="energy-box">


<div class="energy-title">

BALANCE

</div>


<div class="energy" id="balance">

0

</div>



<div class="level" id="level">

LEVEL 1

</div>



</div>







<!-- ПАУК -->


<div class="spider-zone">


<div class="spider">

</div>


<div id="reward">

</div>


</div>





<!-- КНОПКА -->


<div class="tap-area">


<button class="tap" id="tap">

TAP SPIDER

</button>


</div>







<!-- СТАТИСТИКА -->


<div class="stats">


<div>

POWER

<strong id="power">

1

</strong>

</div>



<div>

INCOME

<strong id="income">

0/h

</strong>

</div>



<div>

FRIENDS

<strong id="friends">

0

</strong>

</div>



</div>









<!-- ПАНЕЛЬ ДРУЗЕЙ -->


<div id="friendsPanel" class="panel">


<h2>

FRIENDS

</h2>


<p>

Invite players and earn bonuses

</p>



<div id="inviteLink">

Your link

</div>



<button onclick="copyInvite()">

COPY LINK

</button>



<div class="friends-count">

Invited:

<span id="friendsCount">

0

</span>


</div>


</div>








<!-- ПРОФИЛЬ -->



<div id="profilePanel" class="panel">


<h2>

PROFILE

</h2>


<p id="profileName">

Player

</p>


<p>

Level:
<span id="profileLevel">
1
</span>

</p>


<p>

Balance:
<span id="profileBalance">
0
</span>

</p>


</div>








<!-- МЕНЮ -->


<div class="menu">


<div onclick="openHome()">

HOME

</div>



<div onclick="openUpgrade()">

UPGRADE

</div>



<div onclick="openFriends()">

FRIENDS

</div>



<div onclick="openProfile()">

PROFILE

</div>



</div>






</div>






<script src="telegram.js"></script>

<script src="app.js"></script>



</body>

</html>
