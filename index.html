<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spider Empire</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<header>

<div class="logo">
SPIDER
<br>
<span>EMPIRE</span>
</div>


<div class="user">
<div id="username">
PLAYER
</div>
</div>

</header>




<section class="balance-box">

<p>ENERGY</p>

<h1 id="balance">
0
</h1>

<div class="level">
LEVEL <span id="level">1</span>
</div>

</section>





<section class="arena">


<div class="web"></div>


<div id="spider">

<div class="head"></div>

<div class="body"></div>


<div class="leg one"></div>
<div class="leg two"></div>
<div class="leg three"></div>
<div class="leg four"></div>


</div>


<div id="reward">
</div>



<button id="tap">
TAP
</button>


</section>






<section class="stats">


<div>
POWER
<strong id="power">
1
</strong>
</div>


<div>
INCOME
<strong>
0/h
</strong>
</div>


<div>
RANK
<strong>
NEW
</strong>
</div>


</section>







<nav>


<button>
HOME
</button>


<button>
UPGRADE
</button>


<button>
FRIENDS
</button>


<button>
PROFILE
</button>


</nav>



</div>




<script src="app.js"></script>

</body>

</html>
