<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spider Empire</title>

<link rel="stylesheet" href="style.css">
</head>


<body>

<div class="app">


<header class="logo">
<h1>SPIDER</h1>
<span>EMPIRE</span>
</header>



<section class="balance">

<p>BALANCE</p>

<h2 id="balance">0</h2>

<div class="level">
LEVEL 1
</div>

</section>




<div class="spider-area">

<button class="spider-button" onclick="clickSpider()">

<div class="spider-symbol">
🕷️
</div>

</button>

</div>




<section class="stats">

<div>
<span>POWER</span>
<b>1</b>
</div>

<div>
<span>INCOME</span>
<b>0/h</b>
</div>

<div>
<span>FRIENDS</span>
<b>0</b>
</div>

</section>




<nav class="bottom-menu">

<button class="active">
⌂
<span>HOME</span>
</button>

<button>
⚡
<span>UPGRADE</span>
</button>

<button>
♟
<span>FRIENDS</span>
</button>

<button>
●
<span>PROFILE</span>
</button>

</nav>


</div>



<script>

let coins = 0;

function clickSpider(){

coins++;

document.getElementById("balance").innerText = coins;

}

</script>


</body>

</html>
